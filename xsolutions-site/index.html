<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>X Solutions | Coming Soon</title>
  <meta name="description" content="The X Solutions website is coming soon. Check back soon for updates.">
  <meta name="theme-color" content="#102d2c">
  <link rel="canonical" href="https://xsolutionsmd.com/">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: light; font-family: Arial, Helvetica, sans-serif; color: #102d2c; background: #f4f3ed; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: flex; flex-direction: column; }
    header, footer { display: flex; align-items: center; justify-content: space-between; padding: 30px clamp(24px, 6vw, 88px); }
    .brand { display: flex; align-items: center; gap: 12px; font-size: 17px; font-weight: 700; letter-spacing: -.5px; }
    .mark { width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; background: #102d2c; color: #e0edab; font-size: 24px; font-weight: 400; }
    .domain { color: #506461; font-size: 13px; }
    main { flex: 1; display: grid; place-items: center; padding: 65px 24px 100px; text-align: center; position: relative; overflow: hidden; }
    .content { max-width: 800px; position: relative; }
    .status { display: inline-flex; align-items: center; gap: 9px; padding: 9px 14px; border: 1px solid #cbd7cd; border-radius: 100px; text-transform: uppercase; font-size: 10px; font-weight: 700; letter-spacing: 1.8px; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: #647c39; }
    h1 { font-size: clamp(54px, 9vw, 104px); font-weight: 500; line-height: 1.02; letter-spacing: -.065em; margin: 32px 0 25px; }
    h1 span { display: block; color: #73826c; }
    p { font-size: clamp(16px, 2vw, 19px); color: #52635e; line-height: 1.7; margin: 0 auto; max-width: 420px; }
    .line { width: 48px; height: 3px; background: #aabb7d; margin: 38px auto 0; border-radius: 3px; }
    footer { font-size: 12px; color: #62716a; border-top: 1px solid #dfe2d8; margin: 0 clamp(24px, 6vw, 88px); padding: 24px 0; gap: 16px; }
    @media (max-width: 480px) { header { padding-top: 24px; } header .domain { display: none; } main { padding-top: 55px; padding-bottom: 80px; } footer { flex-wrap: wrap; } }
  </style>
</head>
<body>
  <header><div class="brand"><span class="mark" aria-hidden="true">×</span>X Solutions</div><span class="domain">xsolutionsmd.com</span></header>
  <main><div class="content"><div class="status"><span class="dot" aria-hidden="true"></span>Coming soon</div><h1>A new website.<span>On its way.</span></h1><p>Our website is coming soon.<br>Check back soon for updates.</p><div class="line" aria-hidden="true"></div></div></main>
  <footer><span>© 2026 X Solutions</span><span>xsolutionsmd.com</span></footer>
</body>
</html>
