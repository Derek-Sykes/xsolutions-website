name: xsolutions
services:
  web:
    image: ${XSOLUTIONS_IMAGE:?Use the installed release updater or set XSOLUTIONS_IMAGE to a release digest}
    restart: unless-stopped
    tmpfs:
      - /data
      - /config
    networks:
      proxy:
        aliases:
          - xsolutions-site
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
networks:
  proxy:
    name: xsolutions-proxy
    external: true
